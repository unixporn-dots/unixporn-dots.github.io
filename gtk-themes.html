<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unixporn Dots</title>
    <link rel="icon" href="assets/favicon.ico" />
    <link href="css/main_content.css" rel="stylesheet" />
    <link href="css/footer.css" rel="stylesheet" />

    <!-- OpenGraph element -->
    <meta property="og:title" content="Unixporn GTK-Themes" />
    <meta property="og:site_name" content="Unixporn Dots" />
    <meta property="og:url" content="https://unixporn-dots.github.io/gtk-themes" />
    <meta
      property="og:description"
      content="A collection of everything from the r/unixporn community. Find your perfect gtk theme"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://avatars.githubusercontent.com/u/105546120?s=200&v=4"
    />
    <meta property="og:color" content="#303035" />

    <!-- import fontawesome -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.2/font/bootstrap-icons.css"
    />
    <script
      src="https://kit.fontawesome.com/afcb698043.js"
      crossorigin="anonymous"
      defer
    ></script>
    <!-- Jost semibold -->
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />

    <link href="css/base.css" rel="stylesheet" />
    <link href="css/header.css?v=2" rel="stylesheet" />
    <link href="css/pageSwitcher.css" rel="stylesheet" />

    <script type="module">
      import { initializeGallery } from "./js/index.js";
      import entries from "./js/assets/gtk-themes.js";
      initializeGallery(entries);
    </script>
  </head>

  <body>
    <header id="main_header">
      <h3 class="header-branding">Unixporn Dots</h3>
      <nav id="main_nav">
        <a href="./">Home</a>
        <button id="js-themeSwitcher" class="link-like-button" aria-label="Toggle theme">
          <i id="themeIcon" class="bi bi-sun" aria-hidden="true"></i>
        </button>
        <button id="js-sortSwitcher" class="link-like-button" title="Shuffle">
          <i class="fa-solid fa-shuffle" aria-hidden="true"></i>
        </button>
        <select class="category-box" aria-label="Gallery category">
          <option value="dotfiles">Dotfiles</option>
          <option value="icons">Icons</option>
          <option value="gtk-themes" selected>GTK-Themes</option>
        </select>
        <details class="sponsor-menu">
          <summary aria-label="Sponsor armoredvortex">
            <i class="bi bi-heart sponsor-heart" aria-hidden="true"></i>
            Sponsor
          </summary>
          <div class="sponsor-links">
            <a href="https://ko-fi.com/armoredvortex">Ko-fi</a>
            <a href="https://github.com/sponsors/armoredvortex">GitHub Sponsors</a>
          </div>
        </details>
        <form class="searchform" id="gallerySearch" role="search">
          <div class="inputgroup">
            <input
              class="searchinput"
              id="searchInput"
              type="text"
              placeholder="Search"
              aria-label="Search gallery"
            />
            <button class="btn-submit searchsubmit" type="submit" aria-label="Search">
              <i class="bi bi-search" aria-hidden="true"></i>
            </button>
          </div>
        </form>
      </nav>
      <select class="category-box mobil" aria-label="Gallery category">
          <option value="dotfiles">Dotfiles</option>
          <option value="icons">Icons</option>
          <option value="gtk-themes" selected>GTK-Themes</option>
        </select>
    </header>
    <main id="main_content">
      <div id="gtk_container" data-gallery>
        <!-- Will be filled dynamically -->
      </div>
    </main>
    <div class="page-switcher">
      <div class="previous-container">
        <a id="firstPage" class="page-button" aria-label="First page" href="#main_header">
          <i class="fas fa-angle-double-left"></i>
        </a>
        <a id="prevPage" class="page-button" aria-label="Previous page" href="#main_header">
          <i class="fas fa-angle-left"></i>
        </a>
      </div>
      <div id="page-number" class="page-numbers"></div>
      <div class="next-container">
        <a id="nextPage" class="page-button" aria-label="Next page" href="#main_header">
          <i class="fas fa-angle-right"></i>
        </a>
        <a id="lastPage" class="page-button" aria-label="Last page" href="#main_header">
          <i class="fas fa-angle-double-right"></i>
        </a>
      </div>
    </div>
    <footer id="main_footer">
      <div class="social_links">
        <a class="social_links-icon" href="https://github.com/unixporn-dots/">
          <i class="fab fa-github" aria-hidden="true"></i>
        </a>
        <a class="social_links-icon" href="https://reddit.com/r/unixporn">
          <i class="fab fa-reddit" aria-hidden="true"></i>
        </a>
      </div>
      <p>
        <strong>Unixporn-Dots</strong> is maintained by the community
        with&nbsp;<i class="fas fa-heart" aria-hidden="true"></i>
      </p>
      <div class="linklist">
        <a href="disclaimer.html" style="margin-right: 20px; color: var(--theme-color)"
          >Disclaimer</a
        >
        <a
          style="margin-left: 20px; color: var(--theme-color)"
          href="https://github.com/unixporn-dots/unixporn-dots.github.io/#adding-your-dotfiles"
        >
          Submit your GTK-Themes
        </a>
      </div>
    </footer>
  </body>
</html>
